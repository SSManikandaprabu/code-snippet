<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeSnippet - Developer Code Snippet Manager & Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(16, 185, 129, 0.3);
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(16, 185, 129, 0.6);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-brand-500 selection:text-white">

    <header class="w-full border-b border-slate-800/80 bg-slate-900/80 backdrop-blur-md sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-tr from-brand-600 to-emerald-400 p-2.5 rounded-xl shadow-lg shadow-brand-500/20">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">CodeSnippet</h1>
                    <p class="text-[11px] text-slate-400">Developer Code Snippet Vault</p>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <button onclick="openNewModal()" class="px-3.5 py-2 bg-brand-600 hover:bg-brand-500 text-white rounded-xl text-xs font-semibold transition shadow-lg shadow-brand-600/20 flex items-center gap-1.5">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    <span>New Snippet</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full space-y-6">
        
        <!-- Controls & Filter Bar -->
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
            <div class="relative w-full sm:w-80">
                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </span>
                <input type="text" id="search-input" oninput="filterSnippets()" placeholder="Search snippets by title or tags..." class="w-full bg-slate-900/80 border border-slate-800 rounded-xl pl-10 pr-4 py-2 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-brand-500 transition shadow-inner">
            </div>

            <div class="flex items-center gap-1.5 overflow-x-auto pb-1 custom-scrollbar text-xs">
                <button onclick="filterByLang('all')" id="lang-all" class="px-3 py-1.5 bg-brand-600 text-white rounded-xl font-semibold shrink-0 transition">All</button>
                <button onclick="filterByLang('JavaScript')" id="lang-JavaScript" class="px-3.5 py-1.5 bg-slate-900 text-slate-300 border border-slate-800 rounded-xl shrink-0 transition hover:bg-slate-800">JavaScript</button>
                <button onclick="filterByLang('Python')" id="lang-Python" class="px-3.5 py-1.5 bg-slate-900 text-slate-300 border border-slate-800 rounded-xl shrink-0 transition hover:bg-slate-800">Python</button>
                <button onclick="filterByLang('HTML/CSS')" id="lang-HTML/CSS" class="px-3.5 py-1.5 bg-slate-900 text-slate-300 border border-slate-800 rounded-xl shrink-0 transition hover:bg-slate-800">HTML/CSS</button>
                <button onclick="filterByLang('SQL')" id="lang-SQL" class="px-3.5 py-1.5 bg-slate-900 text-slate-300 border border-slate-800 rounded-xl shrink-0 transition hover:bg-slate-800">SQL</button>
            </div>
        </div>

        <!-- Snippets Grid Container -->
        <div id="snippets-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Populated via JS -->
        </div>

    </main>

    <div id="snippet-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-xl w-full p-6 shadow-2xl relative space-y-4">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <h3 id="modal-heading" class="font-bold text-sm text-white">Create New Snippet</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white p-1">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <form onsubmit="handleFormSubmit(event)" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1.5">Snippet Title</label>
                        <input type="text" id="snip-title" required placeholder="e.g. Debounce Function" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-brand-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1.5">Language</label>
                        <select id="snip-lang" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-xs text-slate-200 focus:outline-none focus:border-brand-500">
                            <option value="JavaScript">JavaScript</option>
                            <option value="Python">Python</option>
                            <option value="HTML/CSS">HTML/CSS</option>
                            <option value="SQL">SQL</option>
                            <option value="Bash">Bash</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1.5">Tags (comma separated)</label>
                    <input type="text" id="snip-tags" placeholder="utils, perf, async" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-brand-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1.5">Code Body</label>
                    <textarea id="snip-code" required rows="6" placeholder="const debounce = (fn, delay) => { ... }" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3.5 font-mono text-xs text-brand-400 placeholder-slate-600 focus:outline-none focus:border-brand-500 custom-scrollbar resize-none"></textarea>
                </div>
                <div class="flex items-center justify-end gap-2 pt-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-xs font-semibold transition">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-brand-600 hover:bg-brand-500 text-white rounded-xl text-xs font-semibold transition shadow-lg shadow-brand-600/20">Save Snippet</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast" class="fixed bottom-6 right-6 z-50 bg-brand-600 text-white px-6 py-3 rounded-2xl shadow-2xl text-xs font-semibold border border-emerald-400/30 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none">
        Notification message
    </div>

    <script>
        let snippets = [];
        let currentLangFilter = 'all';

        function initApp() {
            const saved = localStorage.getItem('codesnippet_vault');
            if (saved) {
                try { snippets = JSON.parse(saved); } catch (e) { snippets = []; }
            } else {
                snippets = [
                    {
                        id: 's1',
                        title: 'Debounce Utility Function',
                        language: 'JavaScript',
                        tags: ['utils', 'perf', 'events'],
                        code: 'const debounce = (func, wait) => {\n  let timeout;\n  return function executedFunction(...args) {\n    const later = () => {\n      clearTimeout(timeout);\n      func(...args);\n    };\n    clearTimeout(timeout);\n    timeout = setTimeout(later, wait);\n  };\n};',
                        updatedAt: new Date().toISOString()
                    },
                    {
                        id: 's2',
                        title: 'Fast API Pagination Query',
                        language: 'Python',
                        tags: ['database', 'api', 'sql'],
                        code: 'def get_paginated_items(db, page: int = 1, size: int = 10):\n    offset = (page - 1) * size\n    return db.query(Item).offset(offset).limit(size).all()',
                        updatedAt: new Date().toISOString()
                    }
                ];
                saveSnippets();
            }
            renderSnippets();
        }

        function saveSnippets() {
            localStorage.setItem('codesnippet_vault', JSON.stringify(snippets));
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        function openNewModal() {
            document.getElementById('modal-heading').textContent = 'Create New Snippet';
            document.getElementById('snip-title').value = '';
            document.getElementById('snip-tags').value = '';
            document.getElementById('snip-code').value = '';
            const modal = document.getElementById('snippet-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal() {
            const modal = document.getElementById('snippet-modal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const title = document.getElementById('snip-title').value.trim();
            const language = document.getElementById('snip-lang').value;
            const tagsInput = document.getElementById('snip-tags').value.trim();
            const code = document.getElementById('snip-code').value;

            const tags = tagsInput ? tagsInput.split(',').map(t => t.trim()).filter(Boolean) : [language.toLowerCase()];

            const newSnippet = {
                id: 'snip_' + Date.now(),
                title,
                language,
                tags,
                code,
                updatedAt: new Date().toISOString()
            };

            snippets.unshift(newSnippet);
            saveSnippets();
            closeModal();
            renderSnippets();
            showToast('Snippet saved to vault!');
        }

        function deleteSnippet(id) {
            snippets = snippets.filter(s => s.id !== id);
            saveSnippets();
            renderSnippets();
            showToast('Snippet deleted.');
        }

        function copyCode(codeText) {
            const textarea = document.createElement('textarea');
            textarea.value = codeText;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            showToast('Code copied to clipboard!');
        }

        function filterByLang(lang) {
            currentLangFilter = lang;
            ['all', 'JavaScript', 'Python', 'HTML/CSS', 'SQL'].forEach(l => {
                const btn = document.getElementById(`lang-${l}`);
                if (btn) {
                    if (l === lang) {
                        btn.className = "px-3.5 py-1.5 bg-brand-600 text-white rounded-xl font-semibold shrink-0 transition";
                    } else {
                        btn.className = "px-3.5 py-1.5 bg-slate-900 text-slate-300 border border-slate-800 rounded-xl shrink-0 transition hover:bg-slate-800";
                    }
                }
            });
            renderSnippets();
        }

        function filterSnippets() {
            renderSnippets();
        }

        function renderSnippets() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const grid = document.getElementById('snippets-grid');

            let filtered = snippets.filter(s => {
                const matchesLang = currentLangFilter === 'all' || s.language === currentLangFilter;
                const matchesQuery = s.title.toLowerCase().includes(query) || s.tags.some(t => t.toLowerCase().includes(query)) || s.code.toLowerCase().includes(query);
                return matchesLang && matchesQuery;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-16 text-slate-500 text-xs">
                        No code snippets found matching your search.
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(s => `
                <div class="bg-slate-900/80 border border-slate-800/80 rounded-3xl p-5 backdrop-blur shadow-xl flex flex-col justify-between space-y-4 group hover:border-brand-500/50 transition">
                    <div>
                        <div class="flex items-center justify-between mb-2">
                            <span class="px-2.5 py-1 bg-brand-500/10 border border-brand-500/30 text-brand-400 text-[10px] font-semibold rounded-xl">${s.language}</span>
                            <button onclick="deleteSnippet('${s.id}')" class="p-1.5 text-slate-500 hover:text-rose-400 transition rounded-lg hover:bg-slate-800" title="Delete Snippet">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </div>
                        <h3 class="text-sm font-bold text-white mb-2">${s.title}</h3>
                        <div class="relative bg-slate-950 border border-slate-800 rounded-2xl p-3.5 max-h-40 overflow-y-auto custom-scrollbar">
                            <pre class="font-mono text-[11px] text-brand-400 leading-relaxed whitespace-pre-wrap">${s.code}</pre>
                        </div>
                    </div>
                    <div class="flex items-center justify-between pt-2 border-t border-slate-800/80 text-[11px]">
                        <div class="flex items-center gap-1.5 flex-wrap">
                            ${s.tags.map(t => `<span class="px-2 py-0.5 bg-slate-950 border border-slate-800 rounded-md text-[10px] text-slate-400">#${t}</span>`).join('')}
                        </div>
                        <button onclick="copyCode(${JSON.stringify(s.code).replace(/"/g, '&quot;')})" class="px-3 py-1.5 bg-slate-800 hover:bg-brand-600 text-slate-200 hover:text-white rounded-xl font-semibold transition border border-slate-700 hover:border-brand-500">
                            Copy Code
                        </button>
                    </div>
                </div>
            `).join('');
        }

        window.onload = () => {
            initApp();
        };
    </script>
</body>
</html>
